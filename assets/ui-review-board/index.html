<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI Review Board</title>
<style>
:root{--bg:#fff;--panel:#f5f8f8;--fg:#173e3c;--muted:#5b6d6c;--line:#d8e1e1;--accent:#0f6e74;--sel:#e1f0ef;
--warn:#a14a00;--warn-bg:#fff0e1;--bad:#b42318;--bad-bg:#fdeceb;--ok:#1d7a3c;--ok-bg:#e5f4e9;--neutral:#ecf0f0}
@media (prefers-color-scheme:dark){:root{--bg:#111818;--panel:#182121;--fg:#e2ebeb;--muted:#9aaaaa;--line:#2a3636;
--accent:#5cc3c8;--sel:#1d3332;--warn:#efa25d;--warn-bg:#382715;--bad:#f18b81;--bad-bg:#3a1b19;--ok:#6fcf8e;--ok-bg:#172f21;--neutral:#212b2b}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,sans-serif;
display:grid;grid-template:auto 1fr/230px 360px 1fr;height:100vh}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0}.muted{color:var(--muted);font-size:12px}
.keys{margin-left:auto;color:var(--muted);font-size:12px}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer}
nav,#list{overflow:auto;border-right:1px solid var(--line)}nav{background:var(--panel);padding:6px 0 24px}
nav h2{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 12px 4px}
nav h3{font-size:12px;margin:10px 12px 2px}
nav .entry{display:block;width:100%;border:0;background:none;padding:4px 12px;text-align:left}
nav .entry .sub{display:block;color:var(--muted);font-size:12px}
nav .entry.on{background:var(--sel)}nav .entry.on .name{font-weight:600}
nav .fold{display:block;border:0;background:none;padding:0;margin:14px 12px 4px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
#filters{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#filters button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 8px;font-size:12px}
#filters button.on{background:var(--sel);border-color:var(--accent)}#filters label{font-size:12px;color:var(--muted);margin-left:auto}
.row{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}.row.on{background:var(--sel)}
.row .t{font-weight:500}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{font-size:11px;padding:0 6px;border-radius:9px;background:var(--neutral);color:var(--muted);white-space:nowrap}
.chip.confirmed,.chip.needs-fix,.chip.provisional{background:var(--bad-bg);color:var(--bad)}
.chip.decision,.chip.uncertain,.chip.design,.chip.not-verified,.chip.raised{background:var(--warn-bg);color:var(--warn)}
.chip.approved,.chip.option,.chip.passed,.chip.dismissed{background:var(--ok-bg);color:var(--ok)}
.chip.mine{outline:1px solid currentColor}.chip.repeat{background:var(--sel);color:var(--accent)}
.match{border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:8px 0;max-width:920px}.match .opt{width:100%;margin-top:4px}.chip.sev-high,.chip.sev-medium{font-weight:600}
main{overflow:auto;padding:14px 18px 60px}main h2{font-size:19px;margin:0 0 4px}
p{margin:6px 0;max-width:920px}.note{color:var(--muted)}
.opts{display:grid;gap:6px;margin:10px 0;max-width:920px}
.opt{display:flex;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px}
.opt kbd{align-self:flex-start}.opt.rec{border-color:var(--accent)}.opt.on{background:var(--sel);border:2px solid var(--accent)}.opt small{color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.acts button{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:4px 10px}.acts button.on{border-color:var(--accent);background:var(--sel);font-weight:600}
textarea{width:100%;max-width:920px;min-height:56px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px}
.shots{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.shots figure{margin:0;width:230px;cursor:zoom-in}.shots img{width:100%;height:160px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:4px;display:block;background:var(--panel)}
.shots figcaption{font-size:11px;color:var(--muted);word-break:break-all}
.question{font-size:16px;font-weight:500}
.screen{margin:10px 0 0;max-width:1440px;cursor:zoom-in}.screen img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.steps{list-style:none;padding:0;margin:12px 0;max-width:1100px}
.steps li{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.steps li>div{flex:1 1 260px;min-width:0}
.steps figure{margin:0;cursor:zoom-in;flex:1 1 320px;max-width:440px}.steps img{width:100%;max-height:360px;object-fit:contain;object-position:left top;border:1px solid var(--line);border-radius:4px;background:var(--panel);display:block}
.steps p{margin:4px 0 0}
details{margin:8px 0;max-width:920px}summary{cursor:pointer;color:var(--accent)}
.occ{border-left:3px solid var(--line);padding:2px 10px;margin:8px 0}.occ dt{font-weight:600;font-size:12px;color:var(--muted)}.occ dd{margin:0 0 4px}
table{border-collapse:collapse;font-size:13px;max-width:920px}td{border-top:1px solid var(--line);padding:3px 8px;vertical-align:top}
.empty{color:var(--muted);padding:20px}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9}
.overlay.on{display:flex}#lightbox{background:rgba(0,0,0,.86)}#lightbox img{max-width:96vw;max-height:88vh;background:#fff}#lightbox div{color:#ddd;font-size:12px;margin-top:6px}
#answers{background:rgba(0,0,0,.45);padding:16px}#answers .box{background:var(--bg);border-radius:8px;padding:14px;width:min(760px,100%)}#answers textarea{min-height:260px}
@media (max-width:980px){body{grid-template:auto auto auto 1fr/1fr;height:auto}nav,#list{max-height:45vh;border-right:0;border-bottom:1px solid var(--line)}.keys{display:none}.shots figure{width:calc(50% - 4px)}.shots img{height:auto}}
</style>
</head>
<body>
<header>
  <h1>UI Review Board</h1><span class="muted" id="summary">Loading…</span>
  <button id="answersButton" class="opt">My answers</button>
  <span class="keys"><kbd>j</kbd><kbd>k</kbd> next and previous · <kbd>1</kbd>–<kbd>4</kbd> choose · <kbd>x</kbd> fix it · <kbd>a</kbd> leave as is · <kbd>d</kbd> decide later · <kbd>f</kbd> note · <kbd>u</kbd> clear · <kbd>l</kbd> same issue · <kbd>Enter</kbd> enlarge · <kbd>h</kbd> hide answered</span>
</header>
<nav id="nav" aria-label="Reviews"></nav>
<div id="list" aria-label="Items"></div>
<main id="detail"><div class="empty">Choose a review on the left.</div></main>
<div id="lightbox" class="overlay"><img alt=""><div></div></div>
<div id="answers" class="overlay"><div class="box"><b>My answers</b><p class="note">Every answer is also saved on this machine. Copy this text to share it.</p>
<textarea readonly></textarea><div class="acts"><button id="answersCopy">Copy</button><button id="answersClose">Close</button></div></div></div>
<script>
const LABEL={decision:'Needs your decision',confirmed:'Confirmed defect',uncertain:'Uncertain',design:'Design decision',
'not-verified':'Not verified',dismissed:'Dismissed by verifier',passed:'Reviewer passed',raised:'Reviewer raised',
approved:'You: leave as is','needs-fix':'You: fix it',deferred:'You: decide later',option:'You chose'};
// The question a finding puts to a person depends on what the reviewer and its verifier concluded.
const QUESTION={confirmed:'The reviewer and a separate verifier both found this a defect. Should it be fixed?',
design:'The reviewer proposes a change, and the verifier judged it a design choice. Should the product change?',
uncertain:'The verifier could not settle this from the screens. Should it be fixed?',
'not-verified':'No verifier has checked this finding. Should it be fixed?',
dismissed:'The verifier found that the screens contradict this finding. Should it be fixed anyway?'};
const CHOICES=[['needs-fix','x','Fix it','Change the product. Say how in the note when it matters.'],
['approved','a','Leave as is','The current behavior is acceptable or intended.'],['deferred','d','Decide later','Keep it open.']];
const FILTERS=[['all','All'],['confirmed','Confirmed'],['uncertain','Uncertain'],['design','Design'],['not-verified','Not verified'],['dismissed','Dismissed'],['screens','Screens']];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let SCREENS={},captureChoices={},appFilter='all';
let INDEX={runs:[],decisions:[],answers:{issues:{},links:{}}},RUNS={},view={kind:'decisions'},filter='all',hide=false,cursor=0,shot=-1,earlierOpen=false;
const A=()=>INDEX.answers;
// A finding answers through the issue it is linked to; a decision or a screen answers under its own identifier.
const issueOf=i=>i.selfIdentified?i.id:(A().links[i.id]||{}).issue;
const V=i=>A().issues[issueOf(i)];
const sharing=i=>{const issue=issueOf(i);return issue&&!i.selfIdentified?Object.values(A().links).filter(l=>l.issue===issue).length-1:0;};
function answerLabel(v,options,screen){const o=v.option&&(options||[]).find(x=>x.key===v.option);return `${screen&&v.status==='approved'?'You agreed':LABEL[v.status]||v.status}${o?': '+o.label:''}`;}
async function api(path,options){const r=await fetch(path,options);const body=await r.json();if(!r.ok)throw new Error(body.error||r.statusText);return body;}
function runner(run){const s=(run.runner||'').toLowerCase();return run.kind==='single'?'Single reviewer':s.includes('claude')?(s.includes('manual')?'Claude, hand-run':'Claude'):s.includes('codex')?'Codex':'Coordinated';}
const PROFILES={chromium:'Mouse','webkit-touch':'Touch'},APPS=['designer','workspace','metadata-editor','openview'];
const day=ts=>new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'}),clock=ts=>ts.slice(11,16);
// The run's profile and reviewer; a run without a profile, or an earlier one, also needs its date to be told apart.
function runTitle(run,earlier){return [PROFILES[run.profile],runner(run),(earlier||!PROFILES[run.profile])&&day(run.updated)+(earlier?' '+clock(run.updated):'')].filter(Boolean).join(' · ');}
function answeredIn(run){const prefix=run.id+'/';return Object.keys(A().links).filter(k=>k.startsWith(prefix)&&!k.slice(prefix.length).includes('/')).length;}
function runCounts(run){return `${run.kind==='single'?count(run.findings,'finding'):count(run.confirmed,'defect')} · ${answeredIn(run)} answered`;}
function runEntry(run,earlier){return `<button class="entry ${view.kind==='run'&&view.id===run.id?'on':''}" data-run="${esc(run.id)}" title="${esc(run.name)}, reviewed ${esc(day(run.updated))} ${esc(clock(run.updated))}"><span class="name">${esc(runTitle(run,earlier))}</span><span class="sub">${esc(runCounts(run))}</span></button>`;}
// The newest review of each application and profile is current; every other one is earlier. A capture
// that records no profile predates them, when every capture drove Chromium with a mouse.
function partition(){const seen=new Set(),current=[],earlier=[];for(const run of INDEX.runs){const key=run.app+'|'+(run.profile||'chromium');(seen.has(key)?earlier:current).push(run);seen.add(key);}return {current,earlier};}
function byApp(runs,earlier){const order=[...APPS,...new Set(runs.map(r=>r.app).filter(a=>!APPS.includes(a)))];
  return order.filter(app=>runs.some(r=>r.app===app)).map(app=>`<h3>${esc(appName(app))}</h3>`+runs.filter(r=>r.app===app).map(r=>runEntry(r,earlier)).join('')).join('');}
function appName(a){return {designer:'Designer',workspace:'Workspace','metadata-editor':'Metadata Editor',openview:'OpenView'}[a]||a;}
async function load(){INDEX=await api('/api/index');
  const latest=INDEX.runs.find(r=>r.kind==='coordinated');
  summarise();
  if(INDEX.decisions.length)view={kind:'decisions'};else if(latest)await openRun(latest.id);render();}
async function openRun(id){if(!RUNS[id])RUNS[id]=await api('/api/run?id='+encodeURIComponent(id));view={kind:'run',id};cursor=0;}
// Every captured state of the latest complete capture where available, for looking through rather than answering.
function screenList(){return (SCREENS[view.profile]||[]).flatMap(c=>c.screens.map(s=>({...s,kind:'screen',title:s.id,app:c.app,area:c.name,captured:c.updated,capture:c})));}
function items(){let list;
  if(view.kind==='screens'){const all=screenList();return appFilter==='all'?all:all.filter(s=>s.app===appFilter);}
  if(view.kind==='decisions')list=INDEX.decisions.map(d=>({...d,status:'decision',kind:'decision'}));
  else{const run=RUNS[view.id];if(!run)return[];list=filter==='screens'?run.states:filter==='all'?run.items:run.items.filter(i=>i.status===filter);}
  return hide?list.filter(i=>!V(i)):list;}
const count=(n,word)=>`${n} ${word}${n===1?'':'s'}`;
function summarise(){$('#summary').textContent=`${count(INDEX.runs.length,'retained review')} · ${count(INDEX.decisions.length,'decision')} · ${count(Object.keys(A().issues).length,'answer')}`;}
function answered(list){return list.filter(i=>V(i)).length;}
function nav(){const {current,earlier}=partition();
  if(view.kind==='run'&&earlier.some(r=>r.id===view.id))earlierOpen=true;
  let html=`<h2>Needs your decision</h2><button class="entry ${view.kind==='decisions'?'on':''}" data-view="decisions"><span class="name">Design decisions</span><span class="sub">${answered(INDEX.decisions)} of ${INDEX.decisions.length} answered</span></button>`;
  html+=`<h2>Current reviews</h2>${byApp(current,false)}`;
  const counts=INDEX.screens||{};
  html+=`<h2>All screens</h2>`+[['chromium','Mouse'],['webkit-touch','Touch']].filter(([p])=>counts[p]).map(([p,label])=>
    `<button class="entry ${view.kind==='screens'&&view.profile===p?'on':''}" data-screens="${p}"><span class="name">${label}</span><span class="sub">${count(counts[p],'screen')}, latest complete capture where available</span></button>`).join('');
  if(earlier.length)html+=`<button class="fold" id="earlier" aria-expanded="${earlierOpen}">${earlierOpen?'▾':'▸'} Earlier reviews (${earlier.length})</button>${earlierOpen?byApp(earlier,true):''}`;
  $('#nav').innerHTML=html;
  $('#nav').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view={kind:'decisions'};cursor=0;render();});
  $('#nav').querySelectorAll('[data-run]').forEach(b=>b.onclick=async()=>{filter='all';await openRun(b.dataset.run);render();});
  $('#earlier')?.addEventListener('click',()=>{earlierOpen=!earlierOpen;nav();});
  $('#nav').querySelectorAll('[data-screens]').forEach(b=>b.onclick=async()=>{const p=b.dataset.screens;
    if(!SCREENS[p])SCREENS[p]=(await api('/api/screens?profile='+encodeURIComponent(p))).captures;captureChoices={};view={kind:'screens',profile:p};appFilter='all';cursor=0;render();});}
async function chooseCapture(app,id){captureChoices[app]=id;const query=new URLSearchParams({profile:view.profile});for(const value of Object.values(captureChoices))query.append('capture',value);SCREENS[view.profile]=(await api('/api/screens?'+query)).captures;cursor=0;render();}
function chips(i){if(i.kind==='screen')return `<span class="chip">${esc(i.area)}</span>${i.group?`<span class="chip">${esc(i.group)}</span>`:''}`;
  const v=V(i);let s=`<span class="chip ${esc(i.status)}">${LABEL[i.status]||esc(i.status)}</span>`;
  if(i.severity)s+=`<span class="chip sev-${esc(i.severity)}">${esc(i.severity)}</span>`;
  if(i.provisional)s+='<span class="chip provisional">Provisional</span>';
  if((i.problems||[]).length)s+='<span class="chip provisional">Not ready to decide</span>';
  if(i.area)s+=`<span class="chip">${esc(i.area)}</span>`;if(i.group)s+=`<span class="chip">${esc(i.group)}</span>`;
  if(v)s+=`<span class="chip mine ${esc(v.status)}">${esc(answerLabel(v,i.options,(i.id||'').includes('/state/')))}</span>`;
  else if((i.matches||[]).length)s+=`<span class="chip repeat">${i.matches[0].likely?'Likely repeat':'Possible repeat'}</span>`;return s;}
function list(){const all=items();if(cursor>=all.length)cursor=Math.max(0,all.length-1);
  let head='';if(view.kind==='screens'){const every=screenList();const apps=[...new Set(every.map(s=>s.app))];
    head=[['all','All',every.length],...apps.map(a=>[a,appName(a),every.filter(s=>s.app===a).length])].map(([k,l,n])=>`<button data-app-filter="${k}" class="${appFilter===k?'on':''}">${esc(l)} ${n}</button>`).join('');}
  else if(view.kind==='run'){const run=RUNS[view.id];const n=k=>k==='all'?run.items.length:k==='screens'?run.states.length:run.items.filter(i=>i.status===k).length;
    head=FILTERS.filter(([k])=>k==='all'||n(k)).map(([k,l])=>`<button data-filter="${k}" class="${filter===k?'on':''}">${l} ${n(k)}</button>`).join('');}
  $('#list').innerHTML=`<div id="filters">${head}${view.kind==='screens'?'':`<label><input type="checkbox" id="hide" ${hide?'checked':''}> Hide answered</label>`}</div>`+
    (all.map((i,n)=>`<div class="row ${n===cursor?'on':''}" data-n="${n}"><div class="t">${esc(i.title)}</div><div class="chips">${chips(i)}</div></div>`).join('')||'<div class="empty">Nothing here.</div>');
  $('#list').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;cursor=0;render();});
  if($('#hide'))$('#hide').onchange=e=>{hide=e.target.checked;cursor=0;render();};
  $('#list').querySelectorAll('[data-app-filter]').forEach(b=>b.onclick=()=>{appFilter=b.dataset.appFilter;cursor=0;render();});
  $('#list').querySelectorAll('.row').forEach(r=>r.onclick=()=>{cursor=+r.dataset.n;list();detail();});
  $('#list .row.on')?.scrollIntoView({block:'nearest'});}
// A decision's screens, in order, each beside what it shows.
function steps(images){return images.length?`<ol class="steps">${images.map((s,n)=>`<li><figure data-shot="${n}"><img loading="lazy" src="${esc(s.src)}" alt="${esc(s.label)}"></figure><div><b>${n+1}. ${esc(s.label)}</b>${s.caption?`<p>${esc(s.caption)}</p>`:''}</div></li>`).join('')}</ol>`:'';}
function shots(images){return images.length?`<div class="shots">${images.map((s,n)=>`<figure data-shot="${n}"><img loading="lazy" src="${esc(s.src)}" alt="${esc(s.label)}"><figcaption>${esc(s.label)}</figcaption></figure>`).join('')}</div>`:'<p class="note">No screenshot retained for this item.</p>';}
function detail(){const i=items()[cursor];if(!i){$('#detail').innerHTML='<div class="empty">Nothing selected.</div>';return;}
  if(i.kind==='screen'){const all=items();
    $('#detail').innerHTML=`<h2>${esc(i.title)}</h2><label>Capture <select id="capture-choice" aria-label="Capture for this application">${i.capture.choices.map(c=>`<option value="${esc(c.id)}" ${c.id===i.capture.id?'selected':''}>${esc(c.updated)} · ${esc(c.status)} · ${c.states} images · ${esc(c.id)}</option>`).join('')}</select></label><p class="note">${esc(i.capture.status)} at capture · ${i.capture.required} required states · ${i.capture.missing.length} missing · build ${esc(i.capture.build.slice(0,12)||'unknown')}. Historical evidence; current deployment has not been checked.</p>${i.capture.newerAvailable?'<p class="note">A newer capture is available in the selector.</p>':''}${i.capture.problems.length?`<details><summary>Capture limitations (${i.capture.problems.length})</summary><p>${i.capture.problems.map(esc).join('<br>')}</p></details>`:''}${i.diagnostic?'<p class="chip provisional">Diagnostic image: the requested state was not reached.</p>':''}<div class="chips"><span class="chip">${esc(i.area)}</span>${i.group?`<span class="chip">${esc(i.group)}</span>`:''}<span class="chip">captured ${esc(day(i.captured))} ${esc(clock(i.captured))}</span></div>
      ${i.note?`<p>${esc(i.note)}</p>`:''}<p class="note">Screen ${cursor+1} of ${all.length} · <kbd>j</kbd> <kbd>k</kbd> next and previous · <kbd>Enter</kbd> full size</p>
      <figure class="screen" data-shot="${cursor}"><img src="${esc(i.src)}" alt="${esc(i.title)}"></figure>`;
    $('#capture-choice').onchange=e=>chooseCapture(i.app,e.target.value);
    $('#detail').querySelector('[data-shot]').onclick=()=>enlarge(cursor);
    // The neighbours load while this screen is looked at, so stepping does not wait for them.
    [cursor+1,cursor-1,cursor+2].forEach(k=>{if(all[k]){const image=new Image();image.src=all[k].src;}});
    $('#detail').scrollTop=0;return;}
  const v=V(i)||{},state=filter==='screens'&&view.kind==='run',shared=sharing(i);
  const options=(i.options||[]).map(o=>`<button class="opt ${o.recommended?'rec':''} ${v.option===o.key?'on':''}" data-option="${esc(o.key)}"><kbd>${esc(o.key)}</kbd><span><b>${esc(o.label)}</b>${o.recommended?' <small>(recommended)</small>':''}<br><small>${esc(o.detail||'')}</small></span></button>`).join('');
  const finding=!options&&!state&&!i.selfIdentified;
  const choices=finding?`<p class="question">${esc(QUESTION[i.status]||'Should this be fixed?')}</p><div class="opts">${CHOICES.map(([status,key,label,detail])=>
    `<button class="opt ${v.status===status?'on':''}" data-status="${status}"><kbd>${key}</kbd><span><b>${label}</b><br><small>${detail}</small></span></button>`).join('')}</div>`:'';
  const acts=(finding||options?'':(`<button data-status="approved" class="${v.status==='approved'?'on':''}"><kbd>a</kbd> ${state?'Agree':'Leave as is'}</button>`)+
    `<button data-status="needs-fix" class="${v.status==='needs-fix'?'on':''}"><kbd>x</kbd> ${state?'Needs fix':'Fix it'}</button><button data-status="deferred" class="${v.status==='deferred'?'on':''}"><kbd>d</kbd> Decide later</button>`)+(V(i)?`<button data-status="clear"><kbd>u</kbd> ${shared?'Unlink':'Clear'}</button>`:'');
  const linked=shared?`<p class="note">Issue ${esc(issueOf(i))} also covers ${count(shared,'other finding')}; an answer here applies to all of them, and Unlink detaches this one.</p>`:'';
  const matches=!V(i)&&(i.matches||[]).length?`<div class="match"><b>${i.matches[0].likely?'Likely':'Possibly'} the same issue as one you answered</b>${i.matches.map((m,n)=>{const a=A().issues[m.issue];
    return `<button class="opt" data-link="${esc(m.issue)}">${n?'':'<kbd>l</kbd>'}<span><b>${esc(m.title)}</b><br><small>${esc(m.issue)} · ${a?esc(answerLabel(a)):''}${a&&a.note?' — '+esc(a.note):''}</small></span></button>`;}).join('')}</div>`:'';
  const occ=(i.occurrences||[]).map(o=>`<div class="occ"><div class="muted">${esc(o.id)} · verifier: <b>${esc(o.verifier)}</b>${o.calibrated===false?' · provisional':''}</div><b>${esc(o.title)}</b><dl>
    ${o.observed?`<dt>Observed</dt><dd>${esc(o.observed)}</dd>`:''}${o.expected?`<dt>Expected</dt><dd>${esc(o.expected)}</dd>`:''}${o.impact?`<dt>Impact</dt><dd>${esc(o.impact)}</dd>`:''}
    ${o.verifierReason?`<dt>Verifier</dt><dd>${esc(o.verifierReason)}</dd>`:''}${o.steps&&o.steps.length?`<dt>Steps</dt><dd>${esc(o.steps.join(' → '))}</dd>`:''}${o.states&&o.states.length?`<dt>States</dt><dd>${esc(o.states.join(', '))}</dd>`:''}</dl></div>`).join('');
  const aspects=i.aspects?`<table>${Object.entries(i.aspects).map(([k,a])=>`<tr><td>${esc(k)}</td><td><span class="chip ${a.status==='acceptable'?'passed':a.status==='not-applicable'?'':'raised'}">${esc(a.status)}</span></td><td>${esc(a.observation)}</td></tr>`).join('')}</table>`:'';
  const decision=i.kind==='decision';
  $('#detail').innerHTML=`<h2>${esc(i.title)}</h2><div class="chips">${chips(i)}</div><p${decision?' class="question"':''}>${esc(i.summary)}</p>${i.note?`<p class="note">${esc(i.note)}</p>`:''}
    ${decision&&(i.problems||[]).length?`<p class="note">Not ready to decide: ${esc(i.problems.join('; '))}.</p>`:''}
    ${decision?`${i.background?`<p>${esc(i.background)}</p>`:''}${steps(i.images||[])}`:''}
    ${matches}${choices}${options?`<div class="opts">${options}</div>`:''}<div class="acts">${acts}</div>${linked}
    <textarea id="note" placeholder="Suggested fix or conditions (press f). Saved when you leave the box.">${esc(v.note||'')}</textarea>
    ${decision?'':(i.images||[]).some(s=>s.caption)?`${(i.images||[]).some(s=>s.screenNote)?'<p class="note">This review predates captions written for each finding, so each screen is described by the reviewer\'s own note on it.</p>':''}${steps(i.images)}`:shots(i.images||[])}${aspects}${occ?`<h3>Reviewer findings</h3>${occ}`:''}`;
  $('#detail').querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>answer({status:'option',option:b.dataset.option}));
  $('#detail').querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>b.dataset.status==='clear'?clear():answer({status:b.dataset.status}));
  $('#detail').querySelectorAll('[data-shot]').forEach(f=>f.onclick=()=>enlarge(+f.dataset.shot));
  $('#detail').querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>link(b.dataset.link));
  $('#note').onchange=e=>answer({note:e.target.value},true);}
function render(){nav();list();detail();}
async function post(body){INDEX.answers=await api('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  // Matches depend on every answer, so reviews read before this one are read again when opened.
  const id=view.kind==='run'?view.id:null;RUNS={};if(id)RUNS[id]=await api('/api/run?id='+encodeURIComponent(id));
  summarise();}
async function answer(change,noteOnly){const i=items()[cursor];if(!i||i.kind==='screen')return;const v={...(V(i)||{})};delete v.title;delete v.app;delete v.at;
  if(noteOnly){v.note=change.note;v.status??='needs-fix';}else{Object.assign(v,change);if(change.status!=='option')v.option=null;v.note=$('#note')?.value??v.note??'';}
  try{await post({id:i.id,...v});}catch(e){alert('Answer not saved: '+e.message);}render();}
async function clear(){const i=items()[cursor];if(!i||i.kind==='screen')return;await post({id:i.id,clear:true});render();}
async function link(issue){const i=items()[cursor];if(!i||!issue)return;try{await post({id:i.id,link:issue});}catch(e){alert('Link not saved: '+e.message);}render();}
function enlarge(n){
  if(view.kind==='screens'){const all=items();if(!all.length)return;cursor=(n+all.length)%all.length;shot=cursor;list();detail();
    const s=all[cursor];$('#lightbox img').src=s.src;$('#lightbox div').textContent=`${s.area} · ${s.title}${s.note?'. '+s.note:''}  ·  ←/→ to step, Esc to close`;$('#lightbox').classList.add('on');return;}
  const i=items()[cursor];if(!i||!(i.images||[]).length)return;shot=(n+i.images.length)%i.images.length;
  $('#lightbox img').src=i.images[shot].src;const s=i.images[shot];$('#lightbox div').textContent=(s.caption?`${s.label}. ${s.caption}`:s.label)+'  ·  ←/→ to step, Esc to close';$('#lightbox').classList.add('on');}
function close(){$('#lightbox').classList.remove('on');$('#answers').classList.remove('on');shot=-1;}
function answerText(){
  return Object.entries(A().issues).map(([id,v])=>{const d=INDEX.decisions.find(x=>x.id===id);const n=Object.values(A().links).filter(l=>l.issue===id).length;
    return `${v.title} [${id}]: ${answerLabel(v,d&&d.options)}${n>1?` (${n} findings)`:''}${v.note?' — '+v.note:''}`;}).join('\n')||'No answers yet.';}
$('#lightbox').onclick=close;$('#answersClose').onclick=close;
$('#answersButton').onclick=()=>{$('#answers textarea').value=answerText();$('#answers').classList.add('on');};
$('#answersCopy').onclick=async()=>{const t=$('#answers textarea');t.select();try{await navigator.clipboard.writeText(t.value);}catch(e){document.execCommand('copy');}$('#answersCopy').textContent='Copied';};
document.addEventListener('keydown',e=>{
  if($('#answers').classList.contains('on')){if(e.key==='Escape')close();return;}
  if(e.target.tagName==='TEXTAREA'){if(e.key==='Escape')e.target.blur();return;}if(e.target.tagName==='INPUT')return;
  if($('#lightbox').classList.contains('on')){if(['Escape','Enter',' '].includes(e.key))close();else if(e.key==='ArrowRight')enlarge(shot+1);else if(e.key==='ArrowLeft')enlarge(shot-1);e.preventDefault();return;}
  const all=items(),i=all[cursor];
  if(e.key==='j'||e.key==='ArrowDown'){cursor=Math.min(all.length-1,cursor+1);list();detail();}
  else if(e.key==='k'||e.key==='ArrowUp'){cursor=Math.max(0,cursor-1);list();detail();}
  else if(/^[1-9]$/.test(e.key)&&i&&(i.options||[]).some(o=>o.key===e.key))answer({status:'option',option:e.key});
  else if(e.key==='a'&&i&&!(i.options||[]).length)answer({status:'approved'});
  else if(e.key==='x')answer({status:'needs-fix'});else if(e.key==='d')answer({status:'deferred'});else if(e.key==='u')clear();
  else if(e.key==='l'&&i&&!V(i)&&(i.matches||[]).length)link(i.matches[0].issue);
  else if(e.key==='f')$('#note')?.focus();else if(e.key==='Enter'||e.key===' ')enlarge(view.kind==='screens'?cursor:0);
  else if(e.key==='h'){hide=!hide;cursor=0;render();}else return;e.preventDefault();});
load().catch(e=>{$('#summary').textContent='Could not load reviews: '+e.message;});
</script>
