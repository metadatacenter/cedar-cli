name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      # Checked out under its own directory so the repositories whose source-of-truth files the
      # CLI consumes can sit beside it, matching the normal $CEDAR_HOME layout.
      - name: Check out cedar-cli
        uses: actions/checkout@v7
        with:
          path: cedar-cli

      # bin/cedar-images-base.sh is the source of truth for image names and
      # versions, and DockerImages reads it rather than restating it. Only that
      # one file is needed, but a partial checkout would cost more to explain
      # than it saves.
      - name: Check out cedar-docker-build beside it
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-docker-build
          ref: develop
          path: cedar-docker-build

      # The native lifecycle integration checks source cedar-services.sh in inspection/library mode.
      # They exercise process-ownership and Docker-port-forwarder safeguards without starting or
      # stopping anything.
      - name: Check out cedar-development beside it
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-development
          ref: develop
          path: cedar-development

      # The sourced native controller rejects any JDK except the estate's supported Java 17.
      # Pin it on both runners so these are platform tests, not runner-image JDK tests.
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Ubuntu 22.04 deployment hosts use Python 3.10; keep that baseline covered.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: cedar-cli/requirements.txt

      - name: Install dependencies
        working-directory: cedar-cli
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      # Tests mock subprocess/filesystem calls, source the native controller in its inspection-only
      # library mode, or inspect a harmless sleeper process. Nothing starts a service or reaches
      # the network.
      - name: Run tests
        working-directory: cedar-cli
        env:
          CEDAR_HOME: ${{ github.workspace }}
        run: python -m pytest tests -v

      - name: Build with noexec temporary storage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        working-directory: cedar-cli
        run: |
          noexec_root="$RUNNER_TEMP/cedar-noexec"
          mkdir -p "$noexec_root"
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs "$noexec_root"
          trap 'sudo umount "$noexec_root"' EXIT
          TMPDIR="$noexec_root" CEDAR_TEST_NOEXEC=1 CEDAR_BUILD_TEMP_INTEGRATION=1 python -m pytest tests/test_build_temp_integration.py -v

      - name: Verify checkout with staging Git 2.34.1
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        working-directory: cedar-cli
        run: |
          curl --fail --location https://www.kernel.org/pub/software/scm/git/git-2.34.1.tar.gz -o "$RUNNER_TEMP/git-2.34.1.tar.gz"
          tar -xzf "$RUNNER_TEMP/git-2.34.1.tar.gz" -C "$RUNNER_TEMP"
          flags="NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_CURL=YesPlease NO_OPENSSL=YesPlease"
          # builtin/bugreport.c includes the generated hook-list.h, and 2.34.1's Makefile
          # declares that dependency for hook.o and builtin/help.o alone. A parallel build
          # therefore reaches bugreport.o before the header exists, so generate it first.
          make -C "$RUNNER_TEMP/git-2.34.1" $flags hook-list.h
          make -C "$RUNNER_TEMP/git-2.34.1" $flags -j2 git
          PATH="$RUNNER_TEMP/git-2.34.1:$PATH" python -m pytest tests/test_git_checkout.py tests/test_git_failures.py -v
