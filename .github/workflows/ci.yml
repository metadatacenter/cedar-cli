name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Checked out under its own directory so cedar-docker-build can sit beside
      # it. tests/test_docker_images.py resolves the image manifest as a sibling
      # clone, the same layout $CEDAR_HOME has, and fails on a lone checkout.
      - name: Check out cedar-cli
        uses: actions/checkout@v7
        with:
          path: cedar-cli

      # bin/cedar-images-base.sh is the source of truth for image names and
      # versions, and DockerImages reads it rather than restating it. Only that
      # one file is needed, but a partial checkout would cost more to explain
      # than it saves.
      - name: Check out cedar-docker-build beside it
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-docker-build
          ref: develop
          path: cedar-docker-build

      # requirements.txt names no Python version and the CLI runs under whatever
      # python3 the developer has. 3.12 is the version Read the Docs builds the
      # documentation with, so the repos stay on one interpreter.
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cedar-cli/requirements.txt

      - name: Install dependencies
        working-directory: cedar-cli
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      # Every test mocks its subprocess and filesystem calls, so nothing here
      # starts a service or reaches the network.
      - name: Run tests
        working-directory: cedar-cli
        run: python -m pytest tests -v
